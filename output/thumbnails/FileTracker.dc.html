<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif; }
    a { color: #5FD4FF; }
    a:hover { color: #9BE5FF; }
  </style>
</helmet>
<div style="--accent: {{accent}}; position: relative; width: 2560px; height: 1440px; overflow: hidden; background: #0B1221; font-family: Helvetica Neue, Helvetica, Arial, sans-serif;">

  <div style="position: absolute; inset: 0; background: radial-gradient(72% 68% at 33% 44%, #13294C 0%, rgba(19,41,76,0) 68%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(21,44,80,0.75) 0%, rgba(11,18,33,0) 52%);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(34% 30% at 92% 44%, rgba(95,212,255,0.16) 0%, rgba(95,212,255,0) 70%);"></div>
  <div style="position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(95,212,255,0.10) 3px, rgba(95,212,255,0) 3.5px); background-size: 80px 80px; background-position: 37px 37px;"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 140px 140px 0 140px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 33px;">
      <div style="width: 132px; height: 132px; border-radius: 34px; border: 2px solid rgba(95,212,255,0.32); background: rgba(95,212,255,0.05); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="132" height="132" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M24 50 H40 L44.5 33 L53 68 L59 50 H74" stroke="var(--accent, #5FD4FF)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 28px; font-weight: 700; letter-spacing: 0.24em; color: var(--accent, #5FD4FF); line-height: 1;">WSO2</div>
        <div style="font-size: 38px; font-weight: 700; letter-spacing: -0.005em; color: #EEF4FB; line-height: 1;">Integrator</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 60px; flex-grow: 1; padding-top: 176px;">

      <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
        <div style="font-size: 46px; font-weight: 700; letter-spacing: 0.13em; color: var(--accent, #5FD4FF); line-height: 1;">GET STARTED</div>
        <div style="margin-top: 56px; font-size: 128px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.05; color: #EEF4FB;">
          <div>Track Local Files</div>
          <div>as They Change</div>
        </div>
        <div style="margin-top: 62px; font-size: 52px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent, #5FD4FF); line-height: 1;">React to every file event</div>
      </div>

      <div style="flex-shrink: 0; margin-top: 145px; margin-right: -140px;">
        <svg width="1000" height="636" viewBox="0 0 880 560" fill="none"
             stroke="var(--accent, #5FD4FF)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <rect x="150" y="132" width="196" height="252" rx="20" fill="#101C30" />
  <line x1="192" y1="192" x2="304" y2="192" stroke-width="6" />
  <line x1="192" y1="240" x2="304" y2="240" stroke-width="6" />
  <line x1="192" y1="288" x2="262" y2="288" stroke-width="6" />
  <path d="M40 288 h122 l42 54 h242 a28 28 0 0 1 28 28 v154 a28 28 0 0 1 -28 28
           H40 a28 28 0 0 1 -28 -28 V316 a28 28 0 0 1 28 -28 z" fill="#101C30" />
  <circle cx="424" cy="204" r="20" fill="var(--accent, #5FD4FF)" stroke="none" />
  <path d="M462 168 a52 52 0 0 1 0 72" stroke-width="7" fill="none" />
  <path d="M496 138 a94 94 0 0 1 0 132" stroke-width="7" fill="none" />
  <path d="M504,322 H844 A28,28 0 0 1 872,350 V414 A28,28 0 0 1 844,442 H504 A28,28 0 0 1 476,414 V406.0 L442,382.0 L476,358.0 V350 A28,28 0 0 1 504,322 Z" fill="#101C30" stroke="var(--accent, #5FD4FF)" stroke-width="7" stroke-linejoin="round" /><text x="674.0" y="382.0" fill="#EEF4FB" stroke="none" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="middle" dominant-baseline="central">File modified</text>
        </svg>
      </div>

    </div>
  </div>

  <sc-if value="{{frame}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; border: 28px solid var(--accent, #5FD4FF); box-sizing: border-box; pointer-events: none;"></div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#5FD4FF","options":["#5FD4FF","#7C9CFF","#5FE3B8","#FFB25F"],"section":"Theme"},"frame":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? "#5FD4FF",
      frame: this.props.frame ?? false
    };
  }
}
</script>
</body>
</html>
