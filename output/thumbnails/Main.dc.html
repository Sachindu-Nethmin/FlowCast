        <div style="font-size: 38px; font-weight: 700; letter-spacing: -0.005em; color: #EEF4FB; line-height: 1;">Integrator</div>

    <div style="display: flex; align-items: flex-start; gap: 60px; flex-grow: 1; padding-top: 176px;">

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#5FD4FF","options":["#5FD4FF","#7C9CFF","#5FE3B8","#FFB25F"],"section":"Theme"},"frame":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? "#5FD4FF",
      frame: this.props.frame ?? false
    };
  }
}
</script>
